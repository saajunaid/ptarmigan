<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="title desc">
  <title id="title">junai end-to-end extension workflow</title>
  <desc id="desc">Readable landscape flow for the junai extension: setup, orchestrated planning, optional preflight, implementation, testing, review, shipping, and governed knowledge promotion back into the pool.</desc>

  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-15%" width="116%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#94a3b8" flood-opacity="0.16"/>
    </filter>
    <style>
      .ui { font-family: Inter, system-ui, sans-serif; }
      .panel { fill: #ffffff; stroke: #dbe7f5; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; }
      .blue-card { fill: #eff6ff; stroke: #38bdf8; stroke-width: 2.2; }
      .green-card { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2.2; }
      .purple-card { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 2.2; stroke-dasharray: 8 6; }
      .purple-knowledge { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .ship-card { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2.2; }
      .title { fill: #0f172a; font-size: 32px; font-weight: 700; }
      .subtitle { fill: #475569; font-size: 15px; }
      .section-blue { fill: #2563eb; font-size: 18px; font-weight: 700; }
      .section-green { fill: #16a34a; font-size: 18px; font-weight: 700; }
      .section-purple { fill: #7c3aed; font-size: 18px; font-weight: 700; }
      .card-title { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .card-sub { fill: #475569; font-size: 14px; }
      .note { fill: #64748b; font-size: 14px; font-style: italic; }
      .warn { fill: #b45309; font-size: 15px; font-weight: 700; }
      .line-blue, .line-green, .line-amber, .line-purple, .line-gray {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .line-blue { stroke: #2563eb; stroke-width: 3; }
      .line-green { stroke: #16a34a; stroke-width: 3; }
      .line-amber { stroke: #d97706; stroke-width: 2.6; }
      .line-purple { stroke: #7c3aed; stroke-width: 2.8; stroke-dasharray: 8 6; }
      .line-gray { stroke: #94a3b8; stroke-width: 2.6; stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,1 L11,6 L0,11 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,1 L11,6 L0,11 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="640" fill="#f8fbff"/>

  <rect x="24" y="18" width="1552" height="68" rx="20" fill="url(#hero)" stroke="#dbe7f5" stroke-width="1.4" filter="url(#shadow)"/>
  <text class="ui title" x="800" y="51" text-anchor="middle">junai — end-to-end extension workflow</text>
  <text class="ui subtitle" x="800" y="73" text-anchor="middle">Project-local pipeline for planning, implementation, verification, and governed learning</text>

  <rect class="panel" x="50" y="106" width="1500" height="118" rx="20"/>
  <text class="ui section-blue" x="74" y="136">1. Setup in the project</text>

  <rect class="panel" x="50" y="244" width="1500" height="252" rx="20"/>
  <text class="ui section-green" x="74" y="274">2. Run the delivery pipeline</text>

  <rect class="panel" x="50" y="516" width="1500" height="96" rx="20"/>
  <text class="ui section-purple" x="74" y="544">3. Capture and promote reusable knowledge</text>

  <rect class="card" x="120" y="148" width="170" height="58" rx="16"/>
  <text class="ui card-title" x="205" y="183" text-anchor="middle">Install</text>
  <text class="ui card-sub" x="205" y="198" text-anchor="middle">Marketplace extension</text>

  <rect class="card" x="330" y="148" width="190" height="58" rx="16"/>
  <text class="ui card-title" x="425" y="183" text-anchor="middle">Initialize</text>
  <text class="ui card-sub" x="425" y="198" text-anchor="middle">Agent Pipeline</text>

  <rect class="blue-card" x="560" y="140" width="240" height="74" rx="18"/>
  <text class="ui card-title" x="680" y="176" text-anchor="middle">Project-local runtime</text>
  <text class="ui card-sub" x="680" y="196" text-anchor="middle">`.github/` + MCP + state</text>

  <rect class="card" x="840" y="148" width="190" height="58" rx="16"/>
  <text class="ui card-title" x="935" y="183" text-anchor="middle">Set mode</text>
  <text class="ui card-sub" x="935" y="198" text-anchor="middle">supervised / assisted / autopilot</text>

  <rect class="blue-card" x="1070" y="148" width="250" height="58" rx="16"/>
  <text class="ui card-title" x="1195" y="183" text-anchor="middle">@Orchestrator</text>
  <text class="ui card-sub" x="1195" y="198" text-anchor="middle">routes the feature request</text>

  <path class="line-blue" d="M290 177 H318" marker-end="url(#arrowBlue)"/>
  <path class="line-blue" d="M520 177 H548" marker-end="url(#arrowBlue)"/>
  <path class="line-blue" d="M800 177 H828" marker-end="url(#arrowBlue)"/>
  <path class="line-blue" d="M1030 177 H1058" marker-end="url(#arrowBlue)"/>

  <rect class="blue-card" x="130" y="334" width="210" height="72" rx="18"/>
  <text class="ui card-title" x="235" y="374" text-anchor="middle">Intent + plan</text>

  <rect class="green-card" x="370" y="334" width="180" height="72" rx="18"/>
  <text class="ui card-title" x="460" y="374" text-anchor="middle">Plan approved?</text>

  <rect class="purple-card" x="580" y="334" width="180" height="72" rx="18"/>
  <text class="ui card-title" x="670" y="365" text-anchor="middle">Optional</text>
  <text class="ui card-title" x="670" y="392" text-anchor="middle">Preflight</text>

  <rect class="blue-card" x="790" y="334" width="160" height="72" rx="18"/>
  <text class="ui card-title" x="870" y="374" text-anchor="middle">Implement</text>

  <rect class="blue-card" x="980" y="334" width="140" height="72" rx="18"/>
  <text class="ui card-title" x="1050" y="374" text-anchor="middle">Test</text>

  <rect class="blue-card" x="1150" y="334" width="150" height="72" rx="18"/>
  <text class="ui card-title" x="1225" y="374" text-anchor="middle">Review</text>

  <rect class="ship-card" x="1330" y="334" width="120" height="72" rx="18"/>
  <text class="ui card-title" x="1390" y="374" text-anchor="middle">Ship</text>

  <path class="line-blue" d="M1195 206 V290 H235 V322" marker-end="url(#arrowBlue)"/>
  <text class="ui note" x="915" y="284">Orchestrator routes the request into the delivery pipeline</text>

  <path class="line-blue" d="M340 370 H358" marker-end="url(#arrowBlue)"/>
  <path class="line-purple" d="M550 370 H568" marker-end="url(#arrowPurple)"/>
  <path class="line-purple" d="M760 370 H778" marker-end="url(#arrowPurple)"/>
  <path class="line-blue" d="M950 370 H968" marker-end="url(#arrowBlue)"/>
  <path class="line-blue" d="M1120 370 H1138" marker-end="url(#arrowBlue)"/>
  <path class="line-green" d="M1300 370 H1318" marker-end="url(#arrowGreen)"/>

  <path class="line-amber" d="M460 334 V304 H235 V322" marker-end="url(#arrowAmber)"/>
  <text class="ui warn" x="347" y="296" text-anchor="middle">NO — refine the plan</text>

  <path class="line-gray" d="M460 406 V448 H870 V418" marker-end="url(#arrowGray)"/>
  <text class="ui note" x="664" y="442" text-anchor="middle">skip preflight when not needed</text>

  <path class="line-amber" d="M1050 406 V468 H870 V418" marker-end="url(#arrowAmber)"/>
  <text class="ui warn" x="960" y="488" text-anchor="middle">FAIL — fix and rerun</text>

  <path class="line-amber" d="M1225 406 V492 H870 V418" marker-end="url(#arrowAmber)"/>
  <text class="ui warn" x="1048" y="512" text-anchor="middle">NO — address review findings and retest</text>

  <rect class="purple-knowledge" x="120" y="558" width="210" height="32" rx="12"/>
  <text class="ui card-title" x="225" y="580" text-anchor="middle">Capture nuggets</text>

  <rect class="purple-knowledge" x="380" y="558" width="250" height="32" rx="12"/>
  <text class="ui card-title" x="505" y="580" text-anchor="middle">Review + promote</text>

  <rect class="purple-knowledge" x="680" y="558" width="210" height="32" rx="12"/>
  <text class="ui card-title" x="785" y="580" text-anchor="middle">Update pool</text>

  <rect class="purple-knowledge" x="940" y="558" width="260" height="32" rx="12"/>
  <text class="ui card-title" x="1070" y="580" text-anchor="middle">Refresh runtimes</text>

  <path class="line-purple" d="M330 574 H368" marker-end="url(#arrowPurple)"/>
  <path class="line-purple" d="M630 574 H668" marker-end="url(#arrowPurple)"/>
  <path class="line-purple" d="M890 574 H928" marker-end="url(#arrowPurple)"/>
</svg>
